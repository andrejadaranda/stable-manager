name: Keep Supabase awake

# Pings a public endpoint that runs a tiny DB query, every 6 hours, so the
# free-tier Supabase project never auto-pauses (which takes the whole App
# Store app down with a 504). The endpoint always returns HTTP 200, so this
# job never "fails" and never emails a failure notice. No secret needed.

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive
        run: |
          curl -sS --max-time 30 "https://app.longrein.eu/api/keepalive" || true
