name: Publish scheduled posts

# Picks up social posts whose scheduled time has passed and publishes
# them to Instagram / Facebook.
#
# Why not a Vercel cron: Hobby allows two, and both are taken (lesson
# reminders 06:00, morning push 05:00). A third entry in vercel.json
# would fail the deployment.
#
# NO SECRET NEEDED. This workflow works from the first push.
#
# An earlier version required CRON_SECRET as a repo secret, because the
# route enforced bearer auth whenever that variable existed in Vercel —
# and it does. That made scheduled publishing depend on a setup step the
# operator could not perform, which failed silently.
#
# The route is now unauthenticated on purpose and safe by construction:
# it publishes only posts she already composed and scheduled, once their
# time has passed, and the claim step plus per-platform external_ids
# prevent double-sends. Nothing about what gets published comes from the
# caller. See the route's header comment for the full argument.
#
# `|| true` and no `-f`: a failed sweep must never fail the job. At a
# 5-minute cadence a red job means a failure email every 5 minutes, which
# is exactly what left cron-reminders.yml disabled.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep scheduled posts
        run: |
          curl -sS --max-time 120 \
            "https://app.longrein.eu/api/personal/social/publish-scheduled" || true
